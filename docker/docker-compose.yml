version: "3.9"

services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: reddick-forum
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - forum_data:/app/data
    environment:
      PORT: "8080"
      DB_PATH: "/app/data/database.db"
      ENV: "production"
      SESSION_TTL_HOURS: "24"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  forum_data:
    driver: local