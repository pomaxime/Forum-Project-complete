{{define "content"}}
<h1>Éditer le post</h1>
{{with .Post}}
<div class="form-card" style="max-width:600px;margin:1rem 0">
    <form method="POST" action="/edit">
        <input type="hidden" name="id" value="{{.ID}}">
        <div class="form-group">
            <label>Titre</label>
            <input type="text" name="title" value="{{.Title}}" required>
        </div>
        <div class="form-group">
            <label>Catégorie</label>
            <select name="category">
                <option value="">-- Choisir --</option>
                <option value="tech" {{if eq .Category "tech"}}selected{{end}}>Tech</option>
                <option value="jeux" {{if eq .Category "jeux"}}selected{{end}}>Jeux</option>
                <option value="general" {{if eq .Category "general"}}selected{{end}}>Général</option>
            </select>
        </div>
        <div class="form-group">
            <label>Contenu</label>
            <textarea name="content" required>{{.Content}}</textarea>
        </div>
        <div style="display:flex;gap:0.5rem">
            <button type="submit">Sauvegarder</button>
            <a href="/" class="btn btn-ghost">Annuler</a>
        </div>
    </form>
</div>
{{end}}
{{end}}
