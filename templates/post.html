{{define "content"}}
{{with .Post}}
<div class="post-card">
    <div class="post-meta">
        <span class="post-author">@{{.Username}}</span>
        · {{.CreatedAt.Format "02/01/2006 à 15:04"}}
    </div>
    <h1>{{.Title}}</h1>
    <p style="margin:1rem 0;color:#444">{{.Content}}</p>
</div>

<div style="margin-top:1rem; display:flex; gap:0.5rem; align-items:center;">
    <a href="/" class="btn btn-ghost">Retour</a>
    {{if $.IsLoggedIn}}
    <a href="/post/create" class="btn btn-primary">Créer un post</a>
    {{end}}
</div>
{{end}}
{{end}}
