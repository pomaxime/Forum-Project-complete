{{define "content"}}
<h1>Profil</h1>
{{with .User}}
<div class="form-card">
    <p><strong>Nom d'utilisateur :</strong> {{.Username}}</p>
    <p style="margin-top:0.5rem"><strong>Email :</strong> {{.Email}}</p>
    <form action="/logout" method="POST" style="display:inline; margin-top:1rem;">
        <button type="submit" class="btn btn-ghost">Se déconnecter</button>
    </form>
</div>
{{end}}
{{end}}
