{{define "content"}}
<div class="auth-page">
    <div class="form-card">
        <h1>Inscription</h1>
        <form method="post" action="/register">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input id="username" type="text" name="username" class="{{.UsernameClass}}" required value="{{.Username}}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" class="{{.EmailClass}}" required value="{{.Email}}">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input id="password" type="password" name="password" class="{{.PasswordClass}}" required minlength="8" value="{{.Password}}">
            </div>
            <button type="submit">Créer mon compte</button>
        </form>
        <p class="form-footer">Déjà un compte ? <a href="/login">Se connecter</a></p>
    </div>
</div>
{{end}}
